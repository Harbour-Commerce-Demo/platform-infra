name: Validate demo infrastructure
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash -n scripts/bootstrap.sh
      - run: node --check scripts/smoke.mjs
      - run: docker compose config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: harbour-demo-deployment
          path: |
            compose.yaml
            .env.example
            scripts/
            README.md
          retention-days: 14
          include-hidden-files: true
